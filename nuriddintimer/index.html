<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PRO FOCUS - Pomodoro & Timer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .glass { background: rgba(17, 24, 39, 0.7); backdrop-filter: blur(16px); }
    </style>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen flex flex-col justify-between selection:bg-indigo-500 selection:text-white">

    <!-- 1. ISM SO'RASH EKRANI (Modal) -->
    <div id="name-modal" class="fixed inset-0 bg-gray-950/90 backdrop-blur-md z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-gray-900 border border-gray-800 p-8 rounded-3xl max-w-md w-full shadow-2xl text-center space-y-6">
            <div class="w-16 h-16 bg-indigo-600/20 border border-indigo-500/30 rounded-2xl flex items-center justify-center mx-auto text-indigo-400 text-2xl">
                <i class="fa-solid fa-user-astronaut"></i>
            </div>
            <div>
                <h2 class="text-2xl font-extrabold text-white mb-2">Xush kelibsiz!</h2>
                <p class="text-sm text-gray-400">Diqqatni jamlash va unumdorlikni oshirish uchun ismingizni kiriting:</p>
            </div>
            <form id="name-form" class="space-y-4">
                <input type="text" id="username-input" required placeholder="Ismingizni yozing..." 
                    class="w-full bg-gray-950 border border-gray-800 rounded-xl px-4 py-3.5 text-center text-sm text-white focus:outline-none focus:border-indigo-500 transition">
                <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-3.5 rounded-xl transition shadow-lg shadow-indigo-600/20 text-sm">
                    Boshlash <i class="fa-solid fa-arrow-right ml-1"></i>
                </button>
            </form>
        </div>
    </div>

    <!-- MAIN APP CONTENT -->
    <div>
        <!-- Navbar -->
        <header class="border-b border-gray-800/80 bg-gray-900/40 sticky top-0 z-40 glass">
            <div class="max-w-5xl mx-auto px-4 py-4 flex justify-between items-center">
                <div class="flex items-center space-x-3">
                    <div class="w-10 h-10 bg-indigo-600 rounded-xl flex items-center justify-center text-white font-black text-xl shadow-lg shadow-indigo-600/30">
                        <i class="fa-solid fa-stopwatch"></i>
                    </div>
                    <span class="text-xl font-black tracking-wider bg-gradient-to-r from-white to-gray-400 bg-clip-text text-transparent">PRO.FOCUS</span>
                </div>
                <!-- Salomlashish va Ism -->
                <div class="flex items-center gap-3">
                    <div class="text-right">
                        <p class="text-xs text-gray-400" id="greeting-text">Xayrli kun,</p>
                        <p class="text-sm font-bold text-indigo-400" id="user-display-name">Foydalanuvchi</p>
                    </div>
                    <button onclick="changeName()" class="text-gray-500 hover:text-gray-300 p-2 text-xs" title="Ismni o'zgartirish">
                        <i class="fa-solid fa-pen"></i>
                    </button>
                </div>
            </div>
        </header>

        <main class="max-w-4xl mx-auto px-4 mt-8 space-y-8">

            <!-- Rejim Tanlash (Pomodoro vs Sekundomer) -->
            <div class="flex justify-center">
                <div class="bg-gray-900/80 p-1.5 border border-gray-800 rounded-2xl flex gap-2">
                    <button id="mode-pomodoro-btn" onclick="switchMainMode('pomodoro')" class="px-6 py-2.5 rounded-xl text-xs font-bold transition bg-indigo-600 text-white shadow-lg">
                        <i class="fa-solid fa-fire mr-1.5"></i> Pomodoro Rejim
                    </button>
                    <button id="mode-stopwatch-btn" onclick="switchMainMode('stopwatch')" class="px-6 py-2.5 rounded-xl text-xs font-bold transition text-gray-400 hover:text-white">
                        <i class="fa-solid fa-stopwatch mr-1.5"></i> Sekundomer
                    </button>
                </div>
            </div>

            <!-- POMODORO SEKSIYASI -->
            <div id="pomodoro-section" class="space-y-6">
                <!-- Taymer Turlari (6 xil) -->
                <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-6 gap-2">
                    <button onclick="setTimerPreset(15, 3)" class="timer-preset p-3 rounded-xl border border-gray-800 bg-gray-900/50 hover:border-indigo-500/50 text-center transition" data-work="15">
                        <div class="text-xs text-gray-400">15 min</div>
                        <div class="text-[10px] text-indigo-400">3 min break</div>
                    </button>
                    <button onclick="setTimerPreset(25, 5)" class="timer-preset p-3 rounded-xl border border-indigo-600 bg-indigo-950/20 text-center transition" data-work="25">
                        <div class="text-xs font-bold text-white">25 min</div>
                        <div class="text-[10px] text-indigo-400">5 min break</div>
                    </button>
                    <button onclick="setTimerPreset(30, 5)" class="timer-preset p-3 rounded-xl border border-gray-800 bg-gray-900/50 hover:border-indigo-500/50 text-center transition" data-work="30">
                        <div class="text-xs text-gray-400">30 min</div>
                        <div class="text-[10px] text-indigo-400">5 min break</div>
                    </button>
                    <button onclick="setTimerPreset(45, 10)" class="timer-preset p-3 rounded-xl border border-gray-800 bg-gray-900/50 hover:border-indigo-500/50 text-center transition" data-work="45">
                        <div class="text-xs text-gray-400">45 min</div>
                        <div class="text-[10px] text-indigo-400">10 min break</div>
                    </button>
                    <button onclick="setTimerPreset(60, 15)" class="timer-preset p-3 rounded-xl border border-gray-800 bg-gray-900/50 hover:border-indigo-500/50 text-center transition" data-work="60">
                        <div class="text-xs text-gray-400">1 soat</div>
                        <div class="text-[10px] text-indigo-400">15 min break</div>
                    </button>
                    <button onclick="setTimerPreset(90, 20)" class="timer-preset p-3 rounded-xl border border-gray-800 bg-gray-900/50 hover:border-indigo-500/50 text-center transition" data-work="90">
                        <div class="text-xs text-gray-400">1.5 soat</div>
                        <div class="text-[10px] text-indigo-400">20 min break</div>
                    </button>
                </div>

                <!-- Katta Taymer Displeyi -->
                <div class="bg-gray-900 border border-gray-800 p-8 rounded-3xl text-center space-y-6 shadow-2xl relative overflow-hidden">
                    <div class="inline-block px-4 py-1.5 rounded-full text-xs font-semibold bg-indigo-950/80 text-indigo-400 border border-indigo-800/40" id="timer-status-tag">
                        Ish vaqti (Focus Time)
                    </div>

                    <div class="text-7xl md:text-8xl font-black tracking-wider text-white font-mono my-4" id="timer-display">
                        25:00
                    </div>

                    <div class="flex justify-center items-center gap-4">
                        <button id="p-start-btn" onclick="togglePomodoro()" class="bg-indigo-600 hover:bg-indigo-500 text-white font-extrabold px-8 py-4 rounded-2xl text-base transition shadow-lg shadow-indigo-600/30 flex items-center gap-2">
                            <i class="fa-solid fa-play"></i> Boshlash
                        </button>
                        <button onclick="resetPomodoro()" class="bg-gray-800 hover:bg-gray-700 text-gray-300 p-4 rounded-2xl text-base transition" title="Qayta o'rnatish">
                            <i class="fa-solid fa-rotate-right"></i>
                        </button>
                        <button onclick="playAlarm()" class="bg-gray-800 hover:bg-gray-700 text-indigo-400 p-4 rounded-2xl text-base transition" title="Budilnikni sinab ko'rish">
                            <i class="fa-solid fa-bell"></i>
                        </button>
                    </div>
                </div>
            </div>

            <!-- SEKUNDOMER SEKSIYASI -->
            <div id="stopwatch-section" class="hidden space-y-6">
                <div class="bg-gray-900 border border-gray-800 p-8 rounded-3xl text-center space-y-6 shadow-2xl">
                    <div class="inline-block px-4 py-1.5 rounded-full text-xs font-semibold bg-purple-950/80 text-purple-400 border border-purple-800/40">
                        Sekundomer Rejimi
                    </div>

                    <div class="text-6xl md:text-8xl font-black tracking-wider text-white font-mono my-4" id="sw-display">
                        00:00:00
                    </div>

                    <div class="flex justify-center items-center gap-4">
                        <button id="sw-start-btn" onclick="toggleStopwatch()" class="bg-purple-600 hover:bg-purple-500 text-white font-extrabold px-8 py-4 rounded-2xl text-base transition shadow-lg shadow-purple-600/30 flex items-center gap-2">
                            <i class="fa-solid fa-play"></i> Boshlash
                        </button>
                        <button onclick="resetStopwatch()" class="bg-gray-800 hover:bg-gray-700 text-gray-300 p-4 rounded-2xl text-base transition">
                            <i class="fa-solid fa-rotate-right"></i>
                        </button>
                    </div>
                </div>
            </div>

        </main>
    </div>

    <!-- Footer -->
    <footer class="text-center py-6 text-xs text-gray-600 border-t border-gray-900 mt-12">
        PRO.FOCUS — Shaxsiy Intizom va Unumdorlik Tizimi
    </footer>

    <script>
        // State variables
        let username = localStorage.getItem('pro_focus_name') || '';
        let workDuration = 25 * 60;
        let breakDuration = 5 * 60;
        let pTimeLeft = workDuration;
        let pIsRunning = false;
        let pIsBreak = false;
        let pTimerInterval = null;

        let swTime = 0;
        let swIsRunning = false;
        let swInterval = null;

        // WEB AUDIO API ORQALI BUDILNIK OVOZI YARATISH
        function playAlarm() {
            try {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                const audioCtx = new AudioContext();
                
                // 3 marta takrorlanuvchi signal ovozi
                const times = [0, 0.2, 0.4];
                times.forEach(delay => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(880, audioCtx.currentTime + delay); // A5 notasi
                    
                    gain.gain.setValueAtTime(0.3, audioCtx.currentTime + delay);
                    gain.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + delay + 0.15);
                    
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    
                    osc.start(audioCtx.currentTime + delay);
                    osc.stop(audioCtx.currentTime + delay + 0.15);
                });
            } catch (e) {
                console.log("Audio xatolik:", e);
            }
        }

        // Ismni va Vaqt bo'yicha Salomlashuvni tekshirish
        function initUser() {
            if (!username) {
                document.getElementById('name-modal').classList.remove('hidden');
            } else {
                document.getElementById('name-modal').classList.add('hidden');
                document.getElementById('user-display-name').innerText = username;
                updateGreeting();
            }
        }

        function updateGreeting() {
            const hour = new Date().getHours();
            let greeting = "Xayrli kun";
            if (hour >= 5 && hour < 12) greeting = "Xayrli tong ☀️";
            else if (hour >= 12 && hour < 18) greeting = "Xayrli kun 🌤️";
            else if (hour >= 18 && hour < 22) greeting = "Xayrli kech 🌙";
            else greeting = "Tungi vaqt, yaxshi dam oling 🌌";
            
            document.getElementById('greeting-text').innerText = greeting + ",";
        }

        document.getElementById('name-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const val = document.getElementById('username-input').value.trim();
            if (val) {
                username = val;
                localStorage.setItem('pro_focus_name', username);
                initUser();
            }
        });

        function changeName() {
            localStorage.removeItem('pro_focus_name');
            username = '';
            initUser();
        }

        // Rejimlarni almashtirish (Pomodoro / Sekundomer)
        function switchMainMode(mode) {
            const pBtn = document.getElementById('mode-pomodoro-btn');
            const swBtn = document.getElementById('mode-stopwatch-btn');
            const pSec = document.getElementById('pomodoro-section');
            const swSec = document.getElementById('stopwatch-section');

            if (mode === 'pomodoro') {
                pBtn.className = "px-6 py-2.5 rounded-xl text-xs font-bold transition bg-indigo-600 text-white shadow-lg";
                swBtn.className = "px-6 py-2.5 rounded-xl text-xs font-bold transition text-gray-400 hover:text-white";
                pSec.classList.remove('hidden');
                swSec.classList.add('hidden');
            } else {
                swBtn.className = "px-6 py-2.5 rounded-xl text-xs font-bold transition bg-purple-600 text-white shadow-lg";
                pBtn.className = "px-6 py-2.5 rounded-xl text-xs font-bold transition text-gray-400 hover:text-white";
                swSec.classList.remove('hidden');
                pSec.classList.add('hidden');
            }
        }

        // --- POMODORO MANTIQI ---
        function setTimerPreset(workMin, breakMin) {
            clearInterval(pTimerInterval);
            pIsRunning = false;
            pIsBreak = false;
            workDuration = workMin * 60;
            breakDuration = breakMin * 60;
            pTimeLeft = workDuration;

            // UI yangilash
            document.querySelectorAll('.timer-preset').forEach(btn => {
                btn.classList.remove('border-indigo-600', 'bg-indigo-950/20');
                btn.classList.add('border-gray-800', 'bg-gray-900/50');
                if (parseInt(btn.getAttribute('data-work')) === workMin) {
                    btn.classList.add('border-indigo-600', 'bg-indigo-950/20');
                    btn.classList.remove('border-gray-800', 'bg-gray-900/50');
                }
            });

            document.getElementById('timer-status-tag').innerText = "Ish vaqti (Focus Time)";
            document.getElementById('p-start-btn').innerHTML = `<i class="fa-solid fa-play"></i> Boshlash`;
            updatePomodoroDisplay();
        }

        function updatePomodoroDisplay() {
            const m = Math.floor(pTimeLeft / 60).toString().padStart(2, '0');
            const s = (pTimeLeft % 60).toString().padStart(2, '0');
            document.getElementById('timer-display').innerText = `${m}:${s}`;
        }

        function togglePomodoro() {
            if (pIsRunning) {
                clearInterval(pTimerInterval);
                pIsRunning = false;
                document.getElementById('p-start-btn').innerHTML = `<i class="fa-solid fa-play"></i> Davom etish`;
            } else {
                pIsRunning = true;
                document.getElementById('p-start-btn').innerHTML = `<i class="fa-solid fa-pause"></i> To'xtatish`;
                pTimerInterval = setInterval(() => {
                    if (pTimeLeft > 0) {
                        pTimeLeft--;
                        updatePomodoroDisplay();
                    } else {
                        // TAYMER TUGADI: Budilnik cholish
                        playAlarm();
                        
                        pIsBreak = !pIsBreak;
                        pTimeLeft = pIsBreak ? breakDuration : workDuration;
                        document.getElementById('timer-status-tag').innerText = pIsBreak ? "Tanaffus Vaqti (Break Time) ☕" : "Ish vaqti (Focus Time)";
                        
                        setTimeout(() => {
                            alert(pIsBreak ? "Vaqt tugadi! Endi biroz dam oling ☕" : "Tanaffus tugadi! Qaytadan ishga kirishamiz 🔥");
                        }, 200);

                        updatePomodoroDisplay();
                    }
                }, 1000);
            }
        }

        function resetPomodoro() {
            clearInterval(pTimerInterval);
            pIsRunning = false;
            pIsBreak = false;
            pTimeLeft = workDuration;
            document.getElementById('timer-status-tag').innerText = "Ish vaqti (Focus Time)";
            document.getElementById('p-start-btn').innerHTML = `<i class="fa-solid fa-play"></i> Boshlash`;
            updatePomodoroDisplay();
        }

        // --- SEKUNDOMER MANTIQI ---
        function updateSwDisplay() {
            const h = Math.floor(swTime / 3600).toString().padStart(2, '0');
            const m = Math.floor((swTime % 3600) / 60).toString().padStart(2, '0');
            const s = (swTime % 60).toString().padStart(2, '0');
            document.getElementById('sw-display').innerText = `${h}:${m}:${s}`;
        }

        function toggleStopwatch() {
            if (swIsRunning) {
                clearInterval(swInterval);
                swIsRunning = false;
                document.getElementById('sw-start-btn').innerHTML = `<i class="fa-solid fa-play"></i> Davom etish`;
            } else {
                swIsRunning = true;
                document.getElementById('sw-start-btn').innerHTML = `<i class="fa-solid fa-pause"></i> To'xtatish`;
                swInterval = setInterval(() => {
                    swTime++;
                    updateSwDisplay();
                }, 1000);
            }
        }

        function resetStopwatch() {
            clearInterval(swInterval);
            swIsRunning = false;
            swTime = 0;
            document.getElementById('sw-start-btn').innerHTML = `<i class="fa-solid fa-play"></i> Boshlash`;
            updateSwDisplay();
        }

        // Ishga tushirish
        initUser();
        updatePomodoroDisplay();
    </script>
</body>
</html>
